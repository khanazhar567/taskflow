services:
  # ── Backend API (Node / Express + Socket.io) ─────────────────────────────
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Set this in the Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CLIENT_URL
        sync: false          # Set to your frontend URL after it is deployed
                             # e.g. https://taskflow-app.onrender.com

  # ── Frontend Static Site (React + Vite) ──────────────────────────────────
  - type: web
    name: taskflow-app
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://taskflow-api.onrender.com/api
      - key: VITE_SOCKET_URL
        sync: false          # e.g. https://taskflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
